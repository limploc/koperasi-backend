<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun Baru - Koperasi</title>

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

  <a href="index.html" class="auth-back-link">
    <span aria-hidden="true">&larr;</span>
    <span>Kembali ke Beranda</span>
  </a>

  <main class="auth-wrapper">
    <section class="auth-card" aria-labelledby="authHeading">

      <!-- Logo Brand Koperasi (Gambar 1) -->
      <a href="index.html" class="auth-brand-logo" title="Kembali ke Beranda">
        <div class="logo-icon-grid" aria-hidden="true">
          <div class="logo-dot"></div>
          <div class="logo-dot"></div>
          <div class="logo-dot"></div>
          <div class="logo-dot"></div>
        </div>
        <span>Koperasi</span>
      </a>

      <!-- Judul & Subjudul -->
      <header class="auth-header">
        <h1 id="authHeading">Buat akun Koperasi</h1>
        <p id="authSubtitle">
          Sudah punya akun?
          <a href="login.html" class="auth-inline-link">Masuk di sini</a>
        </p>
      </header>

      <!-- Form Sign Up: Nama Lengkap, Email, dan No. Telepon -->
      <form class="auth-form" action="pilih-role.html" method="GET">

        <!-- Field 1: Nama Lengkap -->
        <div class="auth-field">
          <label for="nameRegisterInput" class="visually-hidden">Nama Lengkap</label>
          <input
            type="text"
            id="nameRegisterInput"
            name="name"
            class="auth-input"
            placeholder="Nama Lengkap Anda"
            autocomplete="name"
          >
        </div>

        <!-- Field 2: Email -->
        <div class="auth-field">
          <label for="emailRegisterInput" class="visually-hidden">Alamat Email</label>
          <input
            type="email"
            id="emailRegisterInput"
            name="email"
            class="auth-input"
            placeholder="Email Anda"
            autocomplete="email"
            spellcheck="false"
          >
        </div>

        <!-- Field 3: Nomor Telepon -->
        <div class="auth-field">
          <label for="phoneRegisterInput" class="visually-hidden">Nomor Telepon</label>
          <input
            type="tel"
            id="phoneRegisterInput"
            name="phone"
            class="auth-input"
            placeholder="Nomor Telepon (WhatsApp)"
            autocomplete="tel"
          >
        </div>

        <!-- Tombol Lanjut ke Halaman Pilih Role -->
        <a href="pilih-role.html" class="auth-btn-primary">
          Lanjut Pilih Peran &rarr;
        </a>

      </form>

      <!-- Garis Pemisah "atau" -->
      <div class="auth-divider" aria-hidden="true">
        <span>atau</span>
      </div>

      <!-- Tombol Daftar dengan Google (Lanjut ke Pilih Role) -->
      <a href="pilih-role.html" class="auth-btn-google">
        <svg class="google-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Daftar dengan Google</span>
      </a>

      <!-- Catatan Syarat & Kebijakan -->
      <p class="auth-legal">
        Dengan mendaftar, Anda membaca dan menyetujui
        <a href="index.html">Syarat Layanan</a> dan
        <a href="index.html">Kebijakan Privasi</a> kami.
      </p>

    </section>
  </main>

</body>
</html>
