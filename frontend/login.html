<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk Akun - Luckycharm Koperasi</title>
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <!-- Header Ringkas -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="site-logo">
        <div class="logo-icon-grid">
          <div class="logo-dot"></div>
          <div class="logo-dot"></div>
          <div class="logo-dot"></div>
          <div class="logo-dot"></div>
        </div>
        <span>Luckycharm</span>
      </a>

      <nav class="nav-pill-wrapper">
        <div class="nav-pill-container">
          <a href="index.html">Home</a>
          <a href="toko.html">Products</a>
          <a href="sewa.html">Sewa Alat</a>
          <a href="dashboard-petani.html">Dashboard Petani</a>
        </div>
      </nav>

      <div class="header-actions">
        <a href="index.html" class="btn-header-signup">&larr; Kembali ke Beranda</a>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Selamat Datang</h1>
        <p id="roleHelpText">Masuk sebagai anggota koperasi (Pembeli atau Petani Mitra).</p>
      </div>

      <!-- Tab Utama (User vs Admin) -->
      <div class="role-tabs">
        <button type="button" class="role-tab-btn active" id="tabUser">User (Anggota)</button>
        <button type="button" class="role-tab-btn" id="tabAdmin">Admin Koperasi</button>
      </div>

      <!-- Form Login -->
      <form id="loginForm">
        
        <!-- Pilihan Khusus User: Petani atau Pembeli -->
        <div class="user-type-selector" id="userSubSelector">
          <label class="user-radio-label">
            <input type="radio" name="userRole" value="pembeli" id="rolePembeli" checked>
            <span>Pembeli (User Umum)</span>
          </label>
          <label class="user-radio-label">
            <input type="radio" name="userRole" value="petani" id="rolePetani">
            <span>Petani (Akses Dashboard)</span>
          </label>
        </div>

        <div class="form-group">
          <label for="emailInput" class="form-label">Email atau No. Anggota</label>
          <input type="text" id="emailInput" class="form-input" placeholder="contoh: petani@agricharm.id" required>
        </div>

        <div class="form-group">
          <label for="passwordInput" class="form-label">Kata Sandi</label>
          <input type="password" id="passwordInput" class="form-input" placeholder="••••••••" required>
        </div>

        <div class="form-options">
          <label>
            <input type="checkbox" checked>
            <span>Ingat saya</span>
          </label>
          <a href="#" onclick="alert('Fitur reset password dapat dihubungkan ke backend tim Anda.'); return false;">Lupa sandi?</a>
        </div>

        <button type="submit" class="btn btn-dark" style="width: 100%; padding: 0.85rem; font-size: 0.95rem;">
          <span>Masuk Sekarang</span>
          <span class="icon-arrow">&rarr;</span>
        </button>
      </form>

      <!-- Shortcut Pengisian Demo Cepat untuk Tim Pengembang -->
      <div class="demo-shortcuts">
        <p class="demo-title">⚡ Shortcut Uji Coba Demo (1-Klik)</p>
        <div class="demo-btn-group">
          <button type="button" class="btn-demo" onclick="fillDemoUser('petani')">
            🌾 Sebagai Petani
          </button>
          <button type="button" class="btn-demo" onclick="fillDemoUser('pembeli')">
            🛒 Sebagai Pembeli
          </button>
          <button type="button" class="btn-demo" onclick="fillDemoUser('admin')">
            🛡️ Sebagai Admin
          </button>
        </div>
      </div>

    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
